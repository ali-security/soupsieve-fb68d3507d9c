name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector; empty runs the full tox suite'
        required: false
        default: ''

env:
  PIP_INDEX_URL: https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
            continue-on-error: false
          - tox-env: py38
            python-version: 3.8
            continue-on-error: false
          - tox-env: py39
            python-version: 3.9
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.11'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.10'
            continue-on-error: false
          # CPython security releases from 2025 on changed html.parser's iframe handling;
          # pin ubuntu legs to the patch releases current when soupsieve 2.4.1 shipped.
          - platform: ubuntu-22.04
            tox-env: py39
            python-patch: '3.9.16'
          - platform: ubuntu-22.04
            tox-env: py310
            python-patch: '3.10.11'
          - platform: ubuntu-22.04
            tox-env: py311
            python-patch: '3.11.3'
          - platform: ubuntu-22.04
            tox-env: nolxml
            python-patch: '3.11.3'
          - platform: ubuntu-22.04
            tox-env: nohtml5lib
            python-patch: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}
      PYTEST_ADDOPTS: -rs

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-patch || matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Package
      if: matrix.platform == 'ubuntu-22.04' && matrix.tox-env == 'py39'
      run: |
        echo "hatchling==1.14.0" > "$RUNNER_TEMP/build-constraints.txt"
        PIP_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt" python -m build -s -w
    - name: Upload distributions
      if: matrix.platform == 'ubuntu-22.04' && matrix.tox-env == 'py39'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
    - name: Test
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          python -m tox exec -- pytest ${{ inputs.test-filter }}
        else
          python -m tox
        fi

